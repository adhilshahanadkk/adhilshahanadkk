name: Update profile art

on:
  schedule:
    - cron: "17 1 * * *"      # daily, ~06:47 IST
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - profile.yml
      - scripts/**
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build SVGs
        run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh profile art"
            git push
          fi
